[Service]
# systemd 257 reports a credential setup protocol error for this service's
# Type=simple and ExecStartPost combination. Decrypt the identical host-bound
# ciphertext in ExecStartPre, then remove the runtime plaintext on stop.
LoadCredentialEncrypted=
ExecStartPre=/usr/local/lib/openclaw/decrypt-openclaw-credentials.sh
ExecStopPost=/usr/local/lib/openclaw/clear-openclaw-credentials.sh
