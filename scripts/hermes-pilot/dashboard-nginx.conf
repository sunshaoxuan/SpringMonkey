log_format hermes_dashboard_safe '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
server {
    listen 80;
    listen [::]:80;
    server_name sm.briconbric.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/hermes-acme;
    }
    location / {
        return 308 https://sm.briconbric.com$request_uri;
    }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name sm.briconbric.com;
    ssl_certificate /etc/letsencrypt/live/sm.briconbric.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sm.briconbric.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /var/log/nginx/hermes-dashboard-access.log hermes_dashboard_safe;
    add_header Cache-Control "no-store" always;
    location / {
        proxy_pass http://127.0.0.1:19119;
        proxy_http_version 1.1;
        proxy_set_header Host sm.briconbric.com;
        proxy_set_header X-Forwarded-Host sm.briconbric.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 1800s;
    }
}
