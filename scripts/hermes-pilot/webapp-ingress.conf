worker_processes 1;
pid /tmp/hermes-ingress.pid;
error_log /dev/stderr warn;
events { worker_connections 2048; }
http {
    access_log off;
    client_body_temp_path /tmp/hermes-ingress-body;
    proxy_temp_path /tmp/hermes-ingress-proxy;
    fastcgi_temp_path /tmp/hermes-ingress-fastcgi;
    uwsgi_temp_path /tmp/hermes-ingress-uwsgi;
    scgi_temp_path /tmp/hermes-ingress-scgi;
    client_max_body_size 20m;
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    server {
        listen 8080;
        server_name smapp.briconbric.com;
        location = /gmail {
            alias /opt/data/skills/.public-gmail/index.html;
            default_type text/html;
            charset utf-8;
            add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; frame-ancestors 'none'" always;
        }
        location = /gmail/privacy {
            alias /opt/data/skills/.public-gmail/privacy.html;
            default_type text/html;
            charset utf-8;
            add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; frame-ancestors 'none'" always;
        }
        location / {
            proxy_pass http://127.0.0.1:9120;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_read_timeout 7200s;
        }
    }
    server {
        listen 8080;
        server_name sm.briconbric.com;
        location / {
            proxy_pass http://127.0.0.1:9119;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_read_timeout 3600s;
        }
    }
    server {
        listen 8080 default_server;
        server_name _;
        return 444;
    }
}
